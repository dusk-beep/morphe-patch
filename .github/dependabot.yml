version: 2
updates:
  # 1. Keep your Gradle dependencies up to date (libs.versions.toml, build.gradle.kts)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
  

  # 2. Keep your GitHub Actions workflows up to date (e.g., actions/checkout@v4)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
